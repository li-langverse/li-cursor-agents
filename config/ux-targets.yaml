# Internal UX audit targets — see ux-harness/README.md
version: 1
targets:
  - id: lic-docs
    repo: lic
    surface: docs
    surface_class: docs
    adapter: docs
    paths:
      site_dir: ../lic/site
      mkdocs_config: ../lic/mkdocs.yml
    journeys:
      - id: first_reading_path
        steps: [home, language-design, verification]
      - id: mobile_nav
        steps: [home_mobile, nav_drawer]

  - id: agents-dashboard
    repo: li-cursor-agents
    surface: gui
    surface_class: gui_app
    adapter: web_gui
    url: http://127.0.0.1:3099
    fixture: ux-harness/fixtures/agents-dashboard-empty.html
    journeys:
      - id: agents_list_empty
        steps: [open_agents, check_empty_state]
      - id: live_stream
        steps: [open_run, read_stream]

  - id: benchmarks-dashboard
    repo: benchmarks
    surface: gui
    surface_class: gui_app
    adapter: web_gui
    url: http://127.0.0.1:3100
    paths:
      app_dir: ../benchmarks/dashboard-next
      start_script: ../benchmarks/dashboard-next/scripts/dev-ux-harness.sh
    fixture: ux-harness/fixtures/benchmarks-dashboard-fixture.html
    journeys:
      - id: dashboard_home
        steps: [dashboard_home, overview_search]
      - id: gpu_matrix
        steps: [gpu_matrix, chip_picker]

  - id: lic-tetris
    repo: lic
    surface: gui
    surface_class: gui_app
    adapter: native_gui
    paths:
      example: ../lic/examples/tetris
      build_script: ../lic/examples/tetris/build.sh
      capture_script: ux-harness/scripts/lic-tetris-ux-capture-native.sh
    skip_on_platform: [darwin]
    journeys:
      - id: play_session
        steps: [start, mid_game, game_over]

  - id: gui-gen-fixture
    repo: li-cursor-agents
    surface: gui
    surface_class: gui_gen
    adapter: web_gui
    fixture: ux-harness/fixtures/gui-gen-demo.html
    journeys:
      - id: gen_preview_loop
        steps: [prompt, preview, edit]

  - id: tui-app-fixture
    repo: li-cursor-agents
    surface: tui
    surface_class: tui_app
    adapter: tui
    fixture: ux-harness/fixtures/tui-demo.sh
    journeys:
      - id: key_nav_help
        steps: [launch, tab_help, quit]

  - id: tui-gen-fixture
    repo: li-cursor-agents
    surface: tui
    surface_class: tui_gen
    adapter: tui
    fixture: ux-harness/fixtures/tui-gen-demo.sh
    journeys:
      - id: cli_to_tui
        steps: [run_generator, capture_screen]
