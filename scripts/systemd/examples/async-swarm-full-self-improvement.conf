# Full self-improvement profile for li-agents-async-swarm.service
# Copy to: ~/.config/systemd/user/li-agents-async-swarm.service.d/profile.conf
[Service]
Environment=LI_MAINTENANCE_LANE_ENABLED=1
Environment=LI_IMPLEMENT_LANE_ENABLED=1
Environment=LI_SDK_MAX_CONCURRENT=4
# Unset pause/observer-disable from any prior research-only drop-in:
Environment=LI_SWARM_PAUSE_WORKERS=
Environment=LI_OBSERVER_DISABLE=
