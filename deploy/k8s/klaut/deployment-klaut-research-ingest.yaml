# Goal-directed agent: klaut.pro warm index ingest (klaut-pro — klaut-agents-secrets).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: klaut-research-ingest-workspace
  namespace: li-swarm
  labels:
    app: klaut-research-ingest
    klaut.pro/sprint: klaut-research-r1b-ingest
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klaut-research-ingest
  namespace: li-swarm
  labels:
    app: klaut-research-ingest
    app.kubernetes.io/name: klaut-research-ingest
    app.kubernetes.io/component: goal-directed-agent
    app.kubernetes.io/part-of: klaut-pro
    klaut.pro/sprint: klaut-research-r1b-ingest
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: klaut-research-ingest
  template:
    metadata:
      labels:
        app: klaut-research-ingest
        app.kubernetes.io/name: klaut-research-ingest
        app.kubernetes.io/component: goal-directed-agent
        klaut.pro/sprint: klaut-research-r1b-ingest
    spec:
      serviceAccountName: li-goal-worker
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      containers:
        - name: agent
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: klaut-research-ingest
            - configMapRef:
                name: li-goal-worker-runtime
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: klaut-agents-secrets
                  key: GH_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: klaut-agents-secrets
                  key: GH_TOKEN
            - name: WARM_INDEX_PATH
              value: "/warm-index"
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: klaut-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
            - name: S2_API_KEY_FILE
              value: /run/secrets/s2-api-key
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "4"
              memory: "3Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: warm-index
              mountPath: /warm-index
            - name: config-bundle
              mountPath: /config
            - name: s2-api-key
              mountPath: /run/secrets/s2-api-key
              subPath: s2-api-key
              readOnly: true
            - name: homelab-secrets
              mountPath: /srv/homelab/li-research/secrets
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: klaut-research-ingest-workspace
        - name: warm-index
          hostPath:
            path: /srv/homelab/nvme/li-research/warm-index
            type: Directory
        - name: config-bundle
          configMap:
            name: klaut-research-ingest-bundle
            defaultMode: 0755
        - name: s2-api-key
          secret:
            secretName: klaut-research-s2-api-key
            optional: true
            items:
              - key: s2-api-key
                path: s2-api-key
        - name: homelab-secrets
          hostPath:
            path: /srv/homelab/li-research/secrets
            type: DirectoryOrCreate
