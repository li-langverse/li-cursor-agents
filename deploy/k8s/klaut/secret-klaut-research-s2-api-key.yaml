# Semantic Scholar Datasets API key for klaut warm ingest (≥1 GiB staging/s2 gate).
# Copy existing key from li-research-s2-api-key before first apply, or:
#   kubectl get secret li-research-s2-api-key -n li-swarm -o json | jq '.data["s2-api-key"]'
apiVersion: v1
kind: Secret
metadata:
  name: klaut-research-s2-api-key
  namespace: li-swarm
  labels:
    app: klaut-research-ingest
    klaut.pro/component: warm-index
type: Opaque
stringData:
  s2-api-key: "REPLACE_WITH_SEMANTIC_SCHOLAR_DATASETS_API_KEY"
