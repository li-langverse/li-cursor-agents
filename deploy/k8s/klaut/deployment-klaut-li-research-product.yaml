# Goal-directed agent: klaut.pro research product track (klaut-pro GitHub — klaut-agents-secrets).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: klaut-li-research-product-workspace
  namespace: li-swarm
  labels:
    app: klaut-li-research-product
    klaut.pro/sprint: klaut-research-r1b-product
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klaut-li-research-product
  namespace: li-swarm
  labels:
    app: klaut-li-research-product
    app.kubernetes.io/name: klaut-li-research-product
    app.kubernetes.io/component: goal-directed-agent
    app.kubernetes.io/part-of: klaut-pro
    klaut.pro/sprint: klaut-research-r1b-product
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: klaut-li-research-product
  template:
    metadata:
      labels:
        app: klaut-li-research-product
        app.kubernetes.io/name: klaut-li-research-product
        app.kubernetes.io/component: goal-directed-agent
        klaut.pro/sprint: klaut-research-r1b-product
    spec:
      serviceAccountName: li-goal-worker
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      containers:
        - name: agent
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: klaut-li-research-product
            - configMapRef:
                name: li-goal-worker-runtime
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: klaut-agents-secrets
                  key: GH_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: klaut-agents-secrets
                  key: GH_TOKEN
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: klaut-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: config-bundle
              mountPath: /config
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: klaut-li-research-product-workspace
        - name: config-bundle
          configMap:
            name: klaut-li-research-product-bundle
            defaultMode: 0755
