apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-ph-br-0-lib-browser
  namespace: li-swarm
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li-ph-br-0-lib-browser
  template:
    metadata:
      labels:
        app: li-ph-br-0-lib-browser
    spec:
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      containers:
        - name: ph-br-0-lib-browser
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          command: ["/bin/bash", "/scripts/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: li-ph-br-0-lib-browser
          env:
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GITLAB_TOKEN
                  optional: true
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
                  optional: true
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: entrypoint
              mountPath: /scripts
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li-ph-br-0-lib-browser-workspace
        - name: entrypoint
          configMap:
            name: li-ph-br-0-lib-browser-entrypoint
            defaultMode: 0755
