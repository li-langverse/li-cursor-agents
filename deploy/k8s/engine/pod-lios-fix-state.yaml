apiVersion: v1
kind: Pod
metadata:
  name: lios-fix-state
  namespace: li-swarm
spec:
  nodeSelector:
    kubernetes.io/hostname: engine
  restartPolicy: Never
  containers:
    - name: fix
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo '{"phase":"phase-r2-lios-gates"}' > /workspace/lios-kernel-loop/state.json
          cat /workspace/lios-kernel-loop/state.json
      volumeMounts:
        - name: ws
          mountPath: /workspace
  volumes:
    - name: ws
      persistentVolumeClaim:
        claimName: li-lios-kernel-workspace
