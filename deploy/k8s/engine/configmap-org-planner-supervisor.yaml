apiVersion: v1
kind: ConfigMap
metadata:
  name: li-org-planner-supervisor
  namespace: li-swarm
data:
  LI_ORG_PLANNER_SUPERVISOR_ENABLED: "1"
  LI_ORG_PLANNER_SUPERVISOR_INTERVAL_MS: "120000"
  LI_ORG_PLANNER_SUPERVISOR_MAX_IDLE_CYCLES: "3"
  LI_ORG_PLANNER_MAX_WORKERS: "2"
  LI_ORG_PLANNER_RESEARCH_ENABLED: "1"
  LI_ORG_PLANNER_INCLUDE_NEEDS_TRIAGE: "0"
  LI_ORG_PLANNER_ISSUES_PER_RUN: "3"
  LI_ORG_PLANNER_SUPERVISOR_NAMESPACE: "li-swarm"
  LI_CONTROL_PLANE_STORE: "supabase"
  NODE_ENV: "production"
