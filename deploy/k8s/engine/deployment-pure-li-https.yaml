apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-pure-li-https
  namespace: li-swarm
  labels:
    app: li-pure-li-https
    app.kubernetes.io/name: li-pure-li-https
    app.kubernetes.io/component: goal-directed-agent
    li-langverse.io/sprint: pure-li-https
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li-pure-li-https
  template:
    metadata:
      labels:
        app: li-pure-li-https
        app.kubernetes.io/name: li-pure-li-https
        app.kubernetes.io/component: goal-directed-agent
        li-langverse.io/sprint: pure-li-https
    spec:
      serviceAccountName: li-goal-worker
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      containers:
        - name: pure-li-https
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: li-pure-li-https
            - configMapRef:
                name: li-goal-worker-runtime
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
                  optional: true
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GITLAB_TOKEN
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
                  optional: true
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
            - name: CURSOR_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_SDK_KEY
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "4"
              memory: "3Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: config-bundle
              mountPath: /config
            - name: git-auth
              mountPath: /git-auth
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li-pure-li-https-workspace
        - name: config-bundle
          configMap:
            name: li-pure-li-https-bundle
            defaultMode: 0755
        - name: git-auth
          configMap:
            name: li-k8s-git-auth
            defaultMode: 0755