apiVersion: v1
kind: Pod
metadata:
  name: lios-check-build
  namespace: li-swarm
spec:
  nodeSelector:
    kubernetes.io/hostname: engine
  restartPolicy: Never
  containers:
    - name: check
      image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
      command:
        - bash
        - -lc
        - |
          ls -la /workspace/build/ 2>&1 || true
          ls -la /workspace/lik/docs/ 2>&1 || true
          file /workspace/build/hello_kern.elf 2>&1 || true
          python3 -c "import unicorn; print('unicorn ok')" 2>&1 || true
      volumeMounts:
        - name: ws
          mountPath: /workspace
  volumes:
    - name: ws
      persistentVolumeClaim:
        claimName: li-lios-kernel-workspace
