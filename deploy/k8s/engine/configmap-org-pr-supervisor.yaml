apiVersion: v1
kind: ConfigMap
metadata:
  name: li-org-pr-supervisor
  namespace: li-swarm
data:
  LI_ORG_PR_SUPERVISOR_ENABLED: "1"
  LI_ORG_PR_SUPERVISOR_INTERVAL_MS: "900000"
  LI_ORG_PR_SUPERVISOR_MAX_IDLE_CYCLES: "0"
  LI_ORG_PR_SUPERVISOR_MAX_WORKERS: "2"
  LI_ORG_PR_REF_COOLDOWN_MS: "900000"
  LI_ORG_PR_QUEUE_MAX_AGE_MS: "1800000"
  LI_ORG_PR_INCREMENTAL_REFRESH: "1"
  LI_ORG_PR_PRIORITY_BUCKETS: "dirty,ci_not_ok,blocked"
  LI_ORG_PR_GREEN_STALE_MINUTES: "60"
  LI_ORG_PR_SUPERVISOR_NAMESPACE: "li-swarm"
  LI_ORG_PR_SUPERVISOR_IMAGE: "ghcr.io/li-langverse/li-cursor-agents:latest"
  LI_CONTROL_PLANE_STORE: "disk"
  NODE_ENV: "production"
  LI_GIT_HOST: gitlab.lilangverse.xyz
  LI_GIT_GROUP: li-langverse
