apiVersion: v1
kind: Pod
metadata:
  name: lios-step-debug
  namespace: li-swarm
spec:
  nodeSelector:
    kubernetes.io/hostname: engine
  restartPolicy: Never
  containers:
    - name: debug
      image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
      command:
        - bash
        - -lc
        - |
          set -euxo pipefail
          AGENTS_ROOT=/app
          test -f /workspace/lik/docs/kernel-abi.md && echo lik_marker_ok
          test -f /workspace/lic/docs/compiler-kernel-targets.md && echo lic_marker_ok
          test -f /workspace/li-os/scripts/gates/m1-completion-gate.sh && echo lios_marker_ok
          mkdir -p /app/data/goal-directed-sprints
          cp -f /config/lios-kernel-m1.md /app/data/goal-directed-sprints/
          test -f /app/data/goal-directed-sprints/lios-kernel-m1.md && echo goal_ok
          bash -n /config/entrypoint.sh && echo entrypoint_syntax_ok
          echo ALL_STEPS_OK
      volumeMounts:
        - name: ws
          mountPath: /workspace
        - name: cfg
          mountPath: /config
  volumes:
    - name: ws
      persistentVolumeClaim:
        claimName: li-lios-kernel-workspace
    - name: cfg
      configMap:
        name: li-lios-kernel-bundle
        defaultMode: 0755
