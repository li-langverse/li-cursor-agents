apiVersion: v1
kind: ConfigMap
metadata:
  name: li-ph-br-0-lib-browser
  namespace: li-swarm
  labels:
    app: li-ph-br-0-lib-browser
    app.kubernetes.io/name: li-ph-br-0-lib-browser
    app.kubernetes.io/component: goal-directed-agent
    li-langverse.io/sprint: ph-br-0-lib-browser-foundation
data:
  LI_PROOF_EXPLORER_ALWAYS_ON: "1"
  LI_PROOF_EXPLORER_EXIT_ON_COMPLETE: "1"
  LI_PROOF_EXPLORER_PHASE_HANDOFF: "0"
  LI_PROOF_EXPLORER_GOAL_FILE: "data/goal-directed-sprints/ph-br-0-lib-browser-foundation.md"
  LI_PROOF_EXPLORER_LIC_ROOT: "/workspace/lib"
  LI_CURSOR_AGENTS_ROOT: "/app"
  LI_PROOF_EXPLORER_WORKFLOW_REPO: "lib"
  LI_PROOF_EXPLORER_BRANCH: "cursor/ph-br-0-foundation"
  LI_PROOF_EXPLORER_BRANCH_FALLBACKS: "cursor/ph-br-0-foundation,main"
  LI_GITHUB_ORG: "li-langverse"
  LI_PROOF_EXPLORER_LIC_REPO: "lic"
  LI_PROOF_EXPLORER_LIB_REPO: "lib"
  LI_PROOF_EXPLORER_LOOP_SLEEP_SEC: "120"
  LI_PROOF_EXPLORER_AGENT: "code_implementer"
  LI_PROOF_EXPLORER_LOOP_MAX: "0"
  LI_CONTROL_PLANE_STORE: "disk"
  LI_SDK_TERMINAL_STREAM: "1"
  LI_SKIP_IMPLEMENTER_PREFLIGHT_GATE: "1"
  LI_SWARM_EXTERNAL: "1"
  LI_GOAL_SELF_UNBLOCK: "1"
  NODE_ENV: "production"
