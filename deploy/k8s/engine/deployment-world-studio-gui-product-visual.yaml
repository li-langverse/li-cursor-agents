# Always-on World Studio GUI product-visual goal-directed agent (engine node, prebuilt image + PVC workspace).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-world-studio-gui-product-visual
  namespace: li-swarm
  labels:
    app: li-world-studio-gui-product-visual
    app.kubernetes.io/name: li-world-studio-gui-product-visual
    app.kubernetes.io/component: goal-directed-agent
    app.kubernetes.io/part-of: li-langverse
    li-langverse.io/sprint: world-studio-gui-product-visual
    li-langverse.io/role: world-studio-builder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li-world-studio-gui-product-visual
  template:
    metadata:
      labels:
        app: li-world-studio-gui-product-visual
        app.kubernetes.io/name: li-world-studio-gui-product-visual
        app.kubernetes.io/component: goal-directed-agent
        app.kubernetes.io/part-of: li-langverse
        li-langverse.io/sprint: world-studio-gui-product-visual
        li-langverse.io/role: world-studio-builder
      annotations:
        prometheus.io/scrape: "false"
        li-langverse.io/curator: julianmkleber.com
    spec:
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      initContainers:
        - name: git-sync
          image: alpine/git:latest
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: ORG
              value: "li-langverse"
            - name: STUDIO_REPO
              value: "https://github.com/li-langverse/studio.git"
            - name: LIC_REPO
              value: "https://github.com/li-langverse/lic.git"
          command:
            - sh
            - -lc
            - |
              set -eu
              auth_url() {
                echo "$1" | sed "s#https://#https://x-access-token:${GH_TOKEN}@#"
              }
              mkdir -p /workspace
              if [ ! -d /workspace/studio/.git ]; then
                git clone --depth 1 "$(auth_url "$STUDIO_REPO")" /workspace/studio
              else
                git -C /workspace/studio fetch origin --prune
              fi
              if [ ! -d /workspace/lic/.git ]; then
                git clone --depth 1 "$(auth_url "$LIC_REPO")" /workspace/lic
              else
                git -C /workspace/lic fetch origin --prune
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: world-studio-gui-product-visual
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: li-world-studio-gui-product-visual
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
            - name: CURSOR_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_SDK_KEY
                  optional: true
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "8"
              memory: "12Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: config-bundle
              mountPath: /config
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li-world-studio-gui-product-visual-workspace
        - name: config-bundle
          configMap:
            name: li-world-studio-gui-product-visual-bundle
            defaultMode: 0755
