apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: li-proof-explorer-workspace
  namespace: li-swarm
  labels:
    app: li-proof-explorer
    app.kubernetes.io/name: li-proof-explorer
    app.kubernetes.io/component: goal-directed-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
