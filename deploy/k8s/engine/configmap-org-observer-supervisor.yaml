apiVersion: v1
kind: ConfigMap
metadata:
  name: li-org-observer-supervisor
  namespace: li-swarm
data:
  LI_VCS_PROVIDER: "gitlab"
  LI_GITLAB_HOST: "gitlab.lilangverse.xyz"
  LI_GITLAB_GROUP: "li-langverse"
  LI_ORG_OBSERVER_ENABLED: "1"
  LI_ORG_OBSERVER_INTERVAL_MS: "120000"
  LI_ORG_OBSERVER_MAX_IDLE_CYCLES: "0"
  LI_ORG_OBSERVER_DISABLE: "0"
  LI_ORG_LANE_OBSERVER_DISABLE: "0"
  LI_ORG_SCHEDULE_SWARM_OBSERVER: "1"
  LI_ORG_OBSERVER_FORCE_SWARM_ON_STABILITY_FAIL: "1"
  LI_ORG_SWARM_OBSERVER_FAIL_THRESHOLD: "5"
  LI_ORG_SWARM_OBSERVER_MIN_HOURS: "12"
  LI_SWARM_STABILITY_WINDOW_MS: "7200000"
  LI_SWARM_STABILITY_MAX_FAIL_RATE: "0.75"
  LI_CONTROL_PLANE_STORE: "disk"
  NODE_ENV: "production"
