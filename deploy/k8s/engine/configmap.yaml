apiVersion: v1
kind: ConfigMap
metadata:
  name: li-org-issue-worker
  namespace: li-swarm
data:
  LI_VCS_PROVIDER: "gitlab"
  LI_GITLAB_HOST: "gitlab.lilangverse.xyz"
  LI_GITLAB_GROUP: "li-langverse"
  LI_GIT_INTERNAL_SVC: "gitlab.gitlab.svc"
  LI_ORG_ISSUE_WORKER_ALWAYS_ON: "1"
  LI_ORG_ISSUE_WORKER_INTERVAL_MS: "1800000"
  LI_ORG_ISSUE_WORKER_CLOSE_LIMIT: "10"
  LI_CONTROL_PLANE_STORE: "disk"
  NODE_ENV: "production"
