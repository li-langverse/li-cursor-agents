apiVersion: v1
kind: ConfigMap
metadata:
  name: li-org-ga-supervisor
  namespace: li-swarm
data:
  LI_VCS_PROVIDER: "gitlab"
  LI_GITLAB_HOST: "gitlab.lilangverse.xyz"
  LI_GITLAB_GROUP: "li-langverse"
  LI_ORG_GA_SUPERVISOR_ENABLED: "1"
  LI_ORG_GA_SUPERVISOR_INTERVAL_MS: "900000"
  LI_ORG_GA_SUPERVISOR_MAX_IDLE_CYCLES: "0"
  LI_ORG_GA_SUPERVISOR_MAX_WORKERS: "6"
  LI_ORG_GA_SUPERVISOR_NAMESPACE: "li-swarm"
  LI_ORG_GA_SUPERVISOR_IMAGE: "ghcr.io/li-langverse/li-cursor-agents:latest"
  LI_ORG_GA_LANES: "unit,integration,e2e,gui-visual,soc,documentation"
  LI_ORG_GA_REPOS_FILE: "/workspace/roadmap/.github/li-org-repos.txt"
  LI_CONTROL_PLANE_STORE: "disk"
  NODE_ENV: "production"
