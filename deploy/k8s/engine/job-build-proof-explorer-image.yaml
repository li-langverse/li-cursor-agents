# Clone li-cursor-agents, overlay local toolchain fixes, build proof-explorer-llvm22, sideload k3s + push GHCR.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-proof-explorer-image
  namespace: li-swarm
  labels:
    app: li-proof-explorer
    app.kubernetes.io/component: image-build
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: build-proof-explorer-image
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: engine
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: workspace
          emptyDir: {}
        - name: podman-storage
          emptyDir: {}
        - name: overlays
          configMap:
            name: li-proof-explorer-build-overlays
        - name: k3s-bin
          hostPath:
            path: /var/lib/rancher/k3s/data/current/bin
            type: Directory
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd/containerd.sock
            type: Socket
      initContainers:
        - name: git-clone
          image: alpine/git:latest
          env:
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GITLAB_TOKEN
            - name: GIT_REF
              value: "main"
            - name: GIT_REPO
              value: "http://gitlab.gitlab.svc/li-langverse/li-cursor-agents.git"
          command:
            - sh
            - -lc
            - |
              set -eu
              ref="${GIT_REF:-main}"
              dest=/workspace/li-cursor-agents
              tok="${GITLAB_TOKEN}"
              url="http://oauth2:${tok}@${GIT_REPO#http://}"
              git clone --depth 1 --branch "$ref" "$url" "$dest" \
                || git clone --depth 1 "$url" "$dest"
              cp /overlays/deploy__scripts__ensure-llvm22-toolchain.sh "$dest/deploy/scripts/ensure-llvm22-toolchain.sh"
              cp /overlays/deploy__proof-explorer-k8s-entrypoint.sh "$dest/deploy/proof-explorer-k8s-entrypoint.sh"
              cp /overlays/deploy__Dockerfile.proof-explorer "$dest/deploy/Dockerfile.proof-explorer"
              chmod +x "$dest/deploy/scripts/ensure-llvm22-toolchain.sh" "$dest/deploy/proof-explorer-k8s-entrypoint.sh"
              test -f "$dest/deploy/Dockerfile.proof-explorer"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: overlays
              mountPath: /overlays
      containers:
        - name: podman
          image: quay.io/podman/stable:v5.4.2
          securityContext:
            privileged: true
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: IMAGE
              value: "ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22"
            - name: GHCR_USER
              value: li-langverse
            - name: STORAGE_DRIVER
              value: vfs
            - name: BUILDAH_ISOLATION
              value: chroot
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              cd /workspace/li-cursor-agents
              echo "$GH_TOKEN" | podman login ghcr.io -u "$GHCR_USER" --password-stdin
              echo "==> pull lic-ci base"
              podman pull ghcr.io/li-langverse/lic-ci:debian12-llvm22
              echo "==> build $IMAGE"
              podman build -f deploy/Dockerfile.proof-explorer \
                --build-arg LI_CI_IMAGE=ghcr.io/li-langverse/lic-ci:debian12-llvm22 \
                -t "$IMAGE" .
              podman run --rm "$IMAGE" clang-22 --version | head -1
              echo "==> sideload into k3s containerd"
              tar=/tmp/proof-explorer-image.tar
              podman save -o "$tar" "$IMAGE"
              /k3s-bin/ctr --address /run/k3s/containerd/containerd.sock -n k8s.io images import "$tar"
              echo "==> push to ghcr.io (required for blackpearl workers)"
              podman push "$IMAGE"
              echo "pushed to ghcr.io"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: podman-storage
              mountPath: /var/lib/containers
            - name: k3s-bin
              mountPath: /k3s-bin
              readOnly: true
            - name: containerd-sock
              mountPath: /run/k3s/containerd/containerd.sock
