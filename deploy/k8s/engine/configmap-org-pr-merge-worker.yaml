apiVersion: v1
kind: ConfigMap
metadata:
  name: li-org-pr-merge-worker
  namespace: li-swarm
data:
  LI_VCS_PROVIDER: "gitlab"
  LI_GITLAB_HOST: "gitlab.lilangverse.xyz"
  LI_GITLAB_GROUP: "li-langverse"
  LI_ORG_PR_MERGE_WORKER_ALWAYS_ON: "1"
  LI_ORG_PR_MERGE_WORKER_INTERVAL_MS: "600000"
  LI_ORG_PR_MERGE_WORKER_LIMIT: "16"
  LI_CONTROL_PLANE_STORE: "disk"
  NODE_ENV: "production"
