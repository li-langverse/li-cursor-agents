apiVersion: v1
kind: ConfigMap
metadata:
  name: li-org-issue-triage-supervisor
  namespace: li-swarm
data:
  LI_VCS_PROVIDER: "gitlab"
  LI_GITLAB_HOST: "gitlab.lilangverse.xyz"
  LI_GITLAB_GROUP: "li-langverse"
  LI_GIT_INTERNAL_SVC: "gitlab.gitlab.svc"
  LI_ORG_ISSUE_TRIAGE_SUPERVISOR_ENABLED: "1"
  LI_ORG_ISSUE_TRIAGE_SUPERVISOR_INTERVAL_MS: "990000"
  LI_ORG_ISSUE_TRIAGE_CLASSIFY_ENABLED: "0"
  LI_ORG_ISSUE_TRIAGE_SUPERVISOR_MAX_IDLE_CYCLES: "0"
  LI_ORG_ISSUE_TRIAGE_SUPERVISOR_MAX_WORKERS: "1"
  LI_ORG_ISSUE_TRIAGE_REF_COOLDOWN_MS: "3600000"
  LI_ORG_ISSUE_TRIAGE_SUPERVISOR_NAMESPACE: "li-swarm"
  LI_ORG_ISSUE_TRIAGE_SUPERVISOR_IMAGE: "ghcr.io/li-langverse/li-cursor-agents:latest"
  LI_CONTROL_PLANE_STORE: "disk"
  NODE_ENV: "production"
