apiVersion: v1
kind: ConfigMap
metadata:
  name: li-lic-repl
  namespace: li-swarm
  labels:
    app: li-lic-repl
    app.kubernetes.io/name: li-lic-repl
    app.kubernetes.io/component: goal-directed-agent
    li-langverse.io/sprint: lic-repl-compile-run
data:
  LI_PROOF_EXPLORER_ALWAYS_ON: "1"
  LI_PROOF_EXPLORER_PHASE_HANDOFF: "0"
  LI_PROOF_EXPLORER_EXIT_ON_COMPLETE: "1"
  LI_PROOF_EXPLORER_GOAL_FILE: "data/goal-directed-sprints/lic-repl-compile-run.md"
  LI_PROOF_EXPLORER_LIC_ROOT: "/workspace/lic"
  LI_CURSOR_AGENTS_ROOT: "/app"
  LI_PROOF_EXPLORER_WORKFLOW_REPO: "lic"
  LI_PROOF_EXPLORER_BRANCH: "cursor/lic-repl-compile-run"
  LI_PROOF_EXPLORER_BRANCH_FALLBACKS: "cursor/lic-repl-compile-run,main"
  LI_GIT_HOST: "gitlab.lilangverse.xyz"
  LI_GIT_INTERNAL_SVC: "gitlab.gitlab.svc"
  LI_GIT_SSL_VERIFY: "0"
  LI_GIT_GROUP: "li-langverse"
  LI_GIT_REQUIRE_GITLAB: "1"
  LI_GITHUB_ORG: "li-langverse"
  LI_PROOF_EXPLORER_LIC_REPO: "lic"
  LI_PROOF_EXPLORER_LOOP_SLEEP_SEC: "90"
  LI_PROOF_EXPLORER_AGENT: "code_implementer"
  LI_PROOF_EXPLORER_LOOP_MAX: "0"
  LI_CONTROL_PLANE_STORE: "disk"
  LI_SDK_TERMINAL_STREAM: "1"
  LI_SWARM_EXTERNAL: "1"
  LI_GOAL_DEPLOYMENT_NAME: "li-lic-repl"
  LI_GOAL_NAMESPACE: "li-swarm"
  LI_GOAL_SCALE_DOWN_ON_COMPLETE: "0"
  NODE_ENV: "production"
