apiVersion: v1
kind: ConfigMap
metadata:
  name: li-org-issue-supervisor
  namespace: li-swarm
data:
  LI_ORG_ISSUE_SUPERVISOR_ENABLED: "1"
  LI_ORG_ISSUE_SUPERVISOR_INTERVAL_MS: "120000"
  LI_ORG_ISSUE_SUPERVISOR_MAX_IDLE_CYCLES: "3"
  LI_ORG_ISSUE_SUPERVISOR_MAX_WORKERS: "3"
  LI_ORG_ISSUE_MAX_FAILURES: "3"
  LI_ORG_ISSUE_SKIP_HOURS: "24"
  LI_ORG_LANE_OBSERVER_DISABLE: "0"
  LI_ORG_SCHEDULE_SWARM_OBSERVER: "1"
  LI_ORG_ISSUE_SUPERVISOR_NAMESPACE: "li-swarm"
  LI_ORG_ISSUE_SUPERVISOR_IMAGE: "ghcr.io/li-langverse/li-cursor-agents:latest"
  LI_ORG_ISSUE_WORKER_ALWAYS_ON: "1"
  LI_CONTROL_PLANE_STORE: "supabase"
  NODE_ENV: "production"
