apiVersion: v1
kind: ConfigMap
metadata:
  name: li-org-issue-supervisor
  namespace: li-swarm
data:
  LI_ORG_ISSUE_SUPERVISOR_ENABLED: "1"
  LI_ORG_ISSUE_SUPERVISOR_INTERVAL_MS: "600000"
  LI_ORG_ISSUE_SUPERVISOR_MAX_IDLE_CYCLES: "0"
  LI_ORG_ISSUE_SUPERVISOR_MAX_WORKERS: "4"
  LI_ORG_ISSUE_MAX_FAILURES: "10"
  LI_ORG_ISSUE_SKIP_HOURS: "4"
  LI_ORG_ISSUE_QUEUE_MAX_AGE_MS: "1800000"
  LI_ORG_ISSUE_CLASSIFY_ENABLED: "1"
  LI_ORG_LANE_OBSERVER_DISABLE: "0"
  LI_ORG_ISSUE_SUPERVISOR_NAMESPACE: "li-swarm"
  LI_ORG_ISSUE_SUPERVISOR_IMAGE: "ghcr.io/li-langverse/li-cursor-agents:latest"
  LI_ORG_ISSUE_WORKER_ALWAYS_ON: "1"
  LI_CONTROL_PLANE_STORE: "disk"
  NODE_ENV: "production"
