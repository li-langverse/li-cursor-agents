apiVersion: v1
kind: ConfigMap
metadata:
  name: li-world-studio-aimd-demo
  namespace: li-swarm
  labels:
    app: li-world-studio-aimd-demo
    app.kubernetes.io/name: li-world-studio-aimd-demo
    app.kubernetes.io/component: goal-directed-agent
data:
  LI_GIT_HOST: "gitlab.lilangverse.xyz"
  LI_GIT_GROUP: "li-langverse"
  LI_GITHUB_ORG: "li-langverse"
  LI_GIT_INTERNAL_SVC: "gitlab.gitlab.svc"
  LI_GIT_REQUIRE_GITLAB: "1"
  LI_GIT_SSL_VERIFY: "0"
  LI_WORLD_STUDIO_AIMD_DEMO_ALWAYS_ON: "1"
  LI_WORLD_STUDIO_AIMD_DEMO_LOOP_SLEEP_SEC: "60"

  LI_WORLD_STUDIO_AIMD_DEMO_GOAL_FILE: "data/goal-directed-sprints/world-studio-aimd-gpu-production.md"
  LI_WORLD_STUDIO_AIMD_DEMO_WORKFLOW_REPO: "studio"
  LI_WORLD_STUDIO_AIMD_DEMO_AGENT: "world_studio_builder"

  LI_WORLD_STUDIO_AIMD_DEMO_STUDIO_BRANCH: "cursor/world-studio-aimd-gpu-production"
  LI_WORLD_STUDIO_AIMD_DEMO_LIC_BRANCH: "cursor/world-studio-aimd-gpu-production"
  LI_WORLD_STUDIO_AIMD_DEMO_REAL_AIMD_COMPLETION: "1"

  LI_WORLD_STUDIO_AIMD_DEMO_STUDIO_ROOT: "/workspace/studio"
  LI_WORLD_STUDIO_AIMD_DEMO_LIC_ROOT: "/workspace/lic"
  LI_CURSOR_AGENTS_ROOT: "/app"

  LI_GOAL_LOOP_GATE_ONLY: "1"
  LI_GOAL_GATE_PREFER_CWD: "0"
  LI_GOAL_SYNC_CWD_AFTER_RUN: "1"
  LI_GOAL_SELF_UNBLOCK: "1"
  LI_REPO_WORKFLOW_TRACK_REMOTE: "1"
  LI_GOAL_STUCK_THRESHOLD: "5"
  LI_GOAL_SCALE_DOWN_ON_COMPLETE: "1"
  LI_GOAL_DEPLOYMENT_NAME: "li-world-studio-aimd-demo"
  LI_GOAL_NAMESPACE: "li-swarm"

  LI_SKIP_IMPLEMENTER_PREFLIGHT_GATE: "1"
  LI_SDK_TERMINAL_STREAM: "1"

  NODE_ENV: "production"
