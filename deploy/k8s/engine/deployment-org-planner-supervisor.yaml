# Long-running supervisor: merges issue + research planner queues, spawns planner Jobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-org-planner-supervisor
  namespace: li-swarm
  labels:
    app: li-org-planner-supervisor
    li-langverse.io/role: org-planner-supervisor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: li-org-planner-supervisor
  template:
    metadata:
      labels:
        app: li-org-planner-supervisor
    spec:
      serviceAccountName: li-org-planner-supervisor
      nodeSelector:
        li-langverse.io/node-pool: engine
      containers:
        - name: supervisor
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              mkdir -p /app/dist/org-planner /app/dist/cli /app/dist/k8s
              for f in /hotfix/org-planner-*.js; do
                cp "$f" /app/dist/org-planner/
              done
              cp /hotfix/org-planner-supervisor.js /app/dist/cli/org-planner-supervisor.js
              cp /hotfix/org-planner-worker.js /app/dist/cli/org-planner-worker.js
              cp /hotfix/finished-job-ttl.js /app/dist/k8s/finished-job-ttl.js
              exec node dist/cli/org-planner-supervisor.js supervise
          envFrom:
            - configMapRef:
                name: li-org-planner-supervisor
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
                  optional: true
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GITLAB_TOKEN
                  optional: true
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: SUPABASE_URL
                  optional: true
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
                  optional: true
            - name: LI_ORG_PLANNER_HOTFIX_CONFIGMAP
              value: li-org-planner-hotfix
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          volumeMounts:
            - name: planner-hotfix
              mountPath: /hotfix
            - name: sprint-data
              mountPath: /app/data/goal-directed-sprints
      volumes:
        - name: planner-hotfix
          configMap:
            name: li-org-planner-hotfix
        - name: sprint-data
          persistentVolumeClaim:
            claimName: li-agents-sprint-data