# Always-on Proof Explorer goal-directed agent (engine node, prebuilt image + PVC workspace).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-proof-explorer
  namespace: li-swarm
  labels:
    app: li-proof-explorer
    app.kubernetes.io/name: li-proof-explorer
    app.kubernetes.io/component: goal-directed-agent
    app.kubernetes.io/part-of: li-langverse
    li-langverse.io/sprint: proof-explorer-program
    li-langverse.io/role: proof-explorer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li-proof-explorer
  template:
    metadata:
      labels:
        app: li-proof-explorer
        app.kubernetes.io/name: li-proof-explorer
        app.kubernetes.io/component: goal-directed-agent
        app.kubernetes.io/part-of: li-langverse
        li-langverse.io/sprint: proof-explorer-program
        li-langverse.io/role: proof-explorer
      annotations:
        prometheus.io/scrape: "false"
        li-langverse.io/curator: julianmkleber.com
    spec:
      serviceAccountName: li-goal-worker
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      containers:
        - name: proof-explorer
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: li-proof-explorer
            - configMapRef:
                name: li-k8s-git-primary
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
                  optional: true
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GITLAB_TOKEN
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
            - name: CURSOR_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_SDK_KEY
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: config-bundle
              mountPath: /config
            - name: git-auth
              mountPath: /git-auth
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li-proof-explorer-workspace
        - name: config-bundle
          configMap:
            name: li-proof-explorer-bundle
            defaultMode: 0755
        - name: git-auth
          configMap:
            name: li-k8s-git-auth
            defaultMode: 0755
