apiVersion: v1
kind: ConfigMap
metadata:
  name: li-world-studio-gui-product-visual
  namespace: li-swarm
  labels:
    app: li-world-studio-gui-product-visual
    app.kubernetes.io/name: li-world-studio-gui-product-visual
    app.kubernetes.io/component: goal-directed-agent
    li-langverse.io/sprint: world-studio-gui-product-visual
data:
  # Generic engine cluster settings
  NODE_ENV: "production"
  LI_SDK_TERMINAL_STREAM: "1"
  LI_CONTROL_PLANE_STORE: "disk"

  # Repo + branch targets
  LI_GITHUB_ORG: "li-langverse"
  LI_WORKFLOW_REPO: "studio"
  LI_WORKFLOW_BRANCH: "cursor/world-studio-gui-product-visual"
  LI_LIC_REPO: "lic"
  LI_LIC_BRANCH: "main"
  LI_STUDIO_REPO: "studio"
  LI_STUDIO_BRANCH: "cursor/world-studio-gui-product-visual"

  # Workspace roots inside the PVC
  LI_WORKSPACE_ROOT: "/workspace"
  LIC_ROOT: "/workspace/lic"
  STUDIO_ROOT: "/workspace/studio"
  LI_CURSOR_AGENTS_ROOT: "/app"

  # Goal file relative to STUDIO_ROOT
  LI_GOAL_FILE_REL: "data/goal-directed-sprints/world-studio-gui-product-visual.md"

  # Goal-directed loop behavior
  LI_GOAL_LOOP_GATE_ONLY: "1"
  LI_GOAL_GATE_PREFER_CWD: "1"
  LI_GOAL_LOOP_SLEEP_SEC: "60"
  LI_GOAL_MAX: "0"
  LI_GOAL_AGENT: "world_studio_builder"

