apiVersion: v1
kind: ConfigMap
metadata:
  name: li-db-studio-klaut
  namespace: li-swarm
  labels:
    app: li-db-studio-klaut
    app.kubernetes.io/name: li-db-studio-klaut
    app.kubernetes.io/component: goal-directed-agent
    li-langverse.io/sprint: li-db-studio-klaut
data:
  LI_GOAL_WORKSPACE: "/workspace"
  LI_GOAL_FILE: "data/goal-directed-sprints/wp-klaut-homelab.md"
  LI_GOAL_BRANCH: "cursor/li-db-studio-homelab-p0"
  LI_GOAL_AGENT: "code_implementer"
  LI_GOAL_LOOP_SLEEP_SEC: "120"
  LI_GOAL_DEPLOYMENT_NAME: "li-db-studio-klaut"
  LI_GOAL_NAMESPACE: "li-swarm"
  # GitHub-primary (cap-jmk-launchpad) — not li-langverse GitLab
  LI_GIT_HOST: "github.com"
  LI_GIT_GROUP: "cap-jmk-launchpad"
  LI_GIT_REQUIRE_GITLAB: "0"
  LI_GITHUB_ORG: "cap-jmk-launchpad"
  LI_CURSOR_AGENTS_ROOT: "/app"
  LI_CONTROL_PLANE_STORE: "disk"
  LI_SDK_TERMINAL_STREAM: "1"
  LI_SKIP_IMPLEMENTER_PREFLIGHT_GATE: "1"
  NODE_ENV: "production"
