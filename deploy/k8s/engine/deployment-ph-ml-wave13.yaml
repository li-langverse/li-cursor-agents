apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-ph-ml-wave13
  namespace: li-swarm
  labels:
    app: li-ph-ml-wave13
    app.kubernetes.io/name: li-ph-ml-wave13
    app.kubernetes.io/component: goal-directed-agent
    li-langverse.io/sprint: ph-ml-program-complete
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li-ph-ml-wave13
  template:
    metadata:
      labels:
        app: li-ph-ml-wave13
        app.kubernetes.io/name: li-ph-ml-wave13
        app.kubernetes.io/component: goal-directed-agent
        li-langverse.io/sprint: ph-ml-program-complete
    spec:
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      containers:
        - name: ph-ml-wave13
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: li-ph-ml-wave13
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
            - name: CURSOR_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_SDK_KEY
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "8"
              memory: "8Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: entrypoint
              mountPath: /scripts
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li-proof-explorer-workspace
        - name: entrypoint
          configMap:
            name: li-ph-ml-wave13-entrypoint
            defaultMode: 0755