# Goal-directed agent: li-db studio product track (li-langverse token only â€” li-agents-secrets).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: li-db-studio-product-workspace
  namespace: li-swarm
  labels:
    app: li-db-studio-product
    li-langverse.io/sprint: li-db-studio-product
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-db-studio-product
  namespace: li-swarm
  labels:
    app: li-db-studio-product
    app.kubernetes.io/name: li-db-studio-product
    app.kubernetes.io/component: goal-directed-agent
    app.kubernetes.io/part-of: li-langverse
    li-langverse.io/sprint: li-db-studio-product
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li-db-studio-product
  template:
    metadata:
      labels:
        app: li-db-studio-product
        app.kubernetes.io/name: li-db-studio-product
        app.kubernetes.io/component: goal-directed-agent
        li-langverse.io/sprint: li-db-studio-product
    spec:
      serviceAccountName: li-goal-worker
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      containers:
        - name: agent
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: li-db-studio-product
            - configMapRef:
                name: li-k8s-git-primary
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
                  optional: true
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GITLAB_TOKEN
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
            - name: CURSOR_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_SDK_KEY
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: config-bundle
              mountPath: /config
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li-db-studio-product-workspace
        - name: config-bundle
          configMap:
            name: li-db-studio-product-bundle
            defaultMode: 0755
