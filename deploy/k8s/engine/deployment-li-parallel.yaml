apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-li-parallel
  namespace: li-swarm
  labels:
    app: li-li-parallel
    app.kubernetes.io/name: li-li-parallel
    app.kubernetes.io/component: goal-directed-agent
    li-langverse.io/sprint: li-parallel-native-hpc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li-li-parallel
  template:
    metadata:
      labels:
        app: li-li-parallel
        app.kubernetes.io/name: li-li-parallel
        app.kubernetes.io/component: goal-directed-agent
        li-langverse.io/sprint: li-parallel-native-hpc
    spec:
      serviceAccountName: li-goal-worker
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      containers:
        - name: li-parallel
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: li-li-parallel
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
            - name: CURSOR_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_SDK_KEY
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: workspace
              mountPath: /app/data/li-parallel-killer-loop
              subPath: li-parallel-killer-loop
            - name: config-bundle
              mountPath: /config
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li-li-parallel-workspace
        - name: config-bundle
          configMap:
            name: li-li-parallel-bundle
            defaultMode: 0755
