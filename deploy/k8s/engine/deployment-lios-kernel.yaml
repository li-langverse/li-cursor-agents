# Goal-directed agent: LiOS kernel M1 (P0 / P0c) on engine node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-lios-kernel
  namespace: li-swarm
  labels:
    app: li-lios-kernel
    app.kubernetes.io/name: li-lios-kernel
    app.kubernetes.io/component: goal-directed-agent
    app.kubernetes.io/part-of: li-langverse
    li-langverse.io/sprint: lios-kernel-m1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li-lios-kernel
  template:
    metadata:
      labels:
        app: li-lios-kernel
        app.kubernetes.io/name: li-lios-kernel
        app.kubernetes.io/component: goal-directed-agent
        li-langverse.io/sprint: lios-kernel-m1
    spec:
      serviceAccountName: li-goal-worker
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      containers:
        - name: agent
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: li-lios-kernel
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
            - name: CURSOR_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_SDK_KEY
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: workspace
              mountPath: /app/data/lios-kernel-loop
              subPath: lios-kernel-loop
            - name: config-bundle
              mountPath: /config
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li-lios-kernel-workspace
        - name: config-bundle
          configMap:
            name: li-lios-kernel-bundle
            defaultMode: 0755