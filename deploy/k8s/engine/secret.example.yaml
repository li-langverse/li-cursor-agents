# Copy to secret.yaml (do not commit) or create via kubectl (never commit raw tokens):
#   export GH_TOKEN=... CURSOR_API_KEY=...   # from li/.env.github and li/.env
#   kubectl -n li-swarm create secret generic li-agents-secrets \
#     --from-literal=GH_TOKEN="$GH_TOKEN" \
#     --from-literal=CURSOR_API_KEY="$CURSOR_API_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
# Optional Supabase control-plane sync:
#     --from-literal=SUPABASE_URL="$SUPABASE_URL" \
#     --from-literal=SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY"
apiVersion: v1
kind: Secret
metadata:
  name: li-agents-secrets
  namespace: li-swarm
type: Opaque
stringData:
  GH_TOKEN: "REPLACE_ME"
  CURSOR_API_KEY: "REPLACE_ME"
  SUPABASE_URL: ""
  SUPABASE_SERVICE_ROLE_KEY: ""