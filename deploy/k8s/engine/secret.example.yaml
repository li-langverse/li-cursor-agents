# Copy to secret.yaml (do not commit) or create via kubectl:
#   kubectl -n li-swarm create secret generic li-agents-secrets \
#     --from-literal=GH_TOKEN=ghp_... \
#     --from-literal=CURSOR_API_KEY=...   # optional, for future SDK implement passes
apiVersion: v1
kind: Secret
metadata:
  name: li-agents-secrets
  namespace: li-swarm
type: Opaque
stringData:
  GH_TOKEN: "REPLACE_ME"
  CURSOR_API_KEY: ""
