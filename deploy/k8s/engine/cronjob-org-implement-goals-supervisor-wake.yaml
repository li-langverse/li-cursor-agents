# Wake implement-goals supervisor Deployment every 15m if scaled down or pod exited.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: li-org-implement-goals-supervisor-wake
  namespace: li-swarm
  labels:
    app: li-org-implement-goals-supervisor-wake
spec:
  suspend: true
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: li-org-implement-goals-supervisor-wake
        spec:
          serviceAccountName: li-org-implement-goals-supervisor
          restartPolicy: OnFailure
          nodeSelector:
            li-langverse.io/node-pool: engine
          containers:
            - name: wake
              image: ghcr.io/li-langverse/li-cursor-agents:latest
              imagePullPolicy: Always
              command: ["node", "dist/cli/org-implement-goals-supervisor.js", "wake"]
              envFrom:
                - configMapRef:
                    name: li-org-implement-goals-supervisor
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
