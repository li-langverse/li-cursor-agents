apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-ph-sci-simulation-gap-close
  namespace: li-swarm
  labels:
    app: li-ph-sci-simulation-gap-close
    app.kubernetes.io/name: li-ph-sci-simulation-gap-close
    app.kubernetes.io/component: goal-directed-agent
    li-langverse.io/sprint: ph-sci-simulation-gap-close
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li-ph-sci-simulation-gap-close
  template:
    metadata:
      labels:
        app: li-ph-sci-simulation-gap-close
        app.kubernetes.io/name: li-ph-sci-simulation-gap-close
        app.kubernetes.io/component: goal-directed-agent
        li-langverse.io/sprint: ph-sci-simulation-gap-close
    spec:
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      containers:
        - name: ph-sci-simulation-gap-close
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: li-ph-sci-simulation-gap-close
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
            - name: CURSOR_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_SDK_KEY
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li-ph-sci-simulation-gap-close-workspace
