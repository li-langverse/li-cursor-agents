# Always-on benchmark-nightly-green goal-directed agent (engine node, benchmarks + lic workspace).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-benchmark-nightly-green
  namespace: li-swarm
  labels:
    app: li-benchmark-nightly-green
    app.kubernetes.io/name: li-benchmark-nightly-green
    app.kubernetes.io/component: goal-directed-agent
    app.kubernetes.io/part-of: li-langverse
    li-langverse.io/sprint: benchmark-nightly-green
    li-langverse.io/role: benchmark-fix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li-benchmark-nightly-green
  template:
    metadata:
      labels:
        app: li-benchmark-nightly-green
        app.kubernetes.io/name: li-benchmark-nightly-green
        app.kubernetes.io/component: goal-directed-agent
        app.kubernetes.io/part-of: li-langverse
        li-langverse.io/sprint: benchmark-nightly-green
        li-langverse.io/role: benchmark-fix
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: li-goal-worker
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      initContainers:
        - name: git-sync
          image: alpine/git:latest
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: ORG
              value: "li-langverse"
            - name: BENCHMARKS_REPO
              value: "https://github.com/li-langverse/benchmarks.git"
            - name: LIC_REPO
              value: "https://github.com/li-langverse/lic.git"
          command:
            - sh
            - -lc
            - |
              set -eu
              auth_url() {
                echo "$1" | sed "s#https://#https://x-access-token:${GH_TOKEN}@#"
              }
              mkdir -p /workspace
              if [ ! -d /workspace/benchmarks/.git ]; then
                git clone --depth 1 "$(auth_url "$BENCHMARKS_REPO")" /workspace/benchmarks
              else
                git -C /workspace/benchmarks fetch origin --prune
              fi
              if [ ! -d /workspace/lic/.git ]; then
                git clone --depth 1 "$(auth_url "$LIC_REPO")" /workspace/lic
              else
                git -C /workspace/lic fetch origin --prune
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: benchmark-nightly-green
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: li-benchmark-nightly-green
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
            - name: CURSOR_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_SDK_KEY
                  optional: true
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: config-bundle
              mountPath: /config
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li-benchmark-nightly-green-workspace
        - name: config-bundle
          configMap:
            name: li-benchmark-nightly-green-bundle
            defaultMode: 0755
