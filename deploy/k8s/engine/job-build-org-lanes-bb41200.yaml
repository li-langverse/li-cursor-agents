apiVersion: batch/v1
kind: Job
metadata:
  name: build-org-lanes-bb41200
  namespace: li-swarm
  labels:
    app: li-org-swarm
    app.kubernetes.io/component: image-build
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: build-org-lanes-bb41200
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: engine
      volumes:
        - name: workspace
          emptyDir: {}
        - name: podman-storage
          emptyDir: {}
        - name: k3s-bin
          hostPath:
            path: /var/lib/rancher/k3s/data/current/bin
            type: Directory
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd/containerd.sock
            type: Socket
      initContainers:
        - name: git-clone
          image: alpine/git:latest
          env:
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GITLAB_TOKEN
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
                  optional: true
            - name: GIT_COMMIT
              value: "bb41200"
          command:
            - sh
            - -lc
            - |
              set -eo pipefail
              dest=/workspace/li-cursor-agents
              commit="${GIT_COMMIT:-bb41200}"
              rm -rf "$dest"
              cloned=0
              if [ -n "${GITLAB_TOKEN:-}" ]; then
                url="http://oauth2:${GITLAB_TOKEN}@gitlab.gitlab.svc/li-langverse/li-cursor-agents.git"
                if git clone --branch main --depth 80 "$url" "$dest"; then
                  cloned=1
                fi
              fi
              if [ "$cloned" -eq 0 ]; then
                tok="${GH_TOKEN:-}"
                if [ -z "$tok" ]; then
                  echo "GitLab clone failed and GH_TOKEN empty"
                  exit 1
                fi
                url="https://x-access-token:${tok}@github.com/li-langverse/li-cursor-agents.git"
                git clone --branch main --depth 80 "$url" "$dest" || exit 1
              fi
              cd "$dest"
              git checkout "$commit"
              test -f deploy/Dockerfile
              echo "cloned at $(git rev-parse --short HEAD)"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: podman
          image: quay.io/podman/stable:v5.4.2
          securityContext:
            privileged: true
          env:
            - name: IMAGE
              value: ghcr.io/li-langverse/li-cursor-agents:org-lanes-bb41200
            - name: STORAGE_DRIVER
              value: vfs
            - name: BUILDAH_ISOLATION
              value: chroot
          command:
            - bash
            - -lc
            - |
              set -eo pipefail
              cd /workspace/li-cursor-agents
              podman build --no-cache -f deploy/Dockerfile -t "$IMAGE" .
              podman run --rm "$IMAGE" test -f /app/dist/cli/org-implement-goals-supervisor.js
              podman run --rm "$IMAGE" test -f /app/dist/cli/org-observer-supervisor.js
              echo "verified supervisor entrypoints in image"
              tar=/tmp/org-lanes-bb41200.tar
              podman save -o "$tar" "$IMAGE"
              /k3s-bin/ctr --address /run/k3s/containerd/containerd.sock -n k8s.io images import "$tar"
              /k3s-bin/ctr --address /run/k3s/containerd/containerd.sock -n k8s.io images ls | grep org-lanes-bb41200 || true
              echo "sideloaded $IMAGE into k3s containerd on engine"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: podman-storage
              mountPath: /var/lib/containers
            - name: k3s-bin
              mountPath: /k3s-bin
              readOnly: true
            - name: containerd-sock
              mountPath: /run/k3s/containerd/containerd.sock
