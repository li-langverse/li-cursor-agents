apiVersion: v1
kind: ConfigMap
metadata:
  name: li-org-unblocker-supervisor
  namespace: li-swarm
data:
  LI_VCS_PROVIDER: "gitlab"
  LI_GITLAB_HOST: "gitlab.lilangverse.xyz"
  LI_GITLAB_GROUP: "li-langverse"
  LI_ORG_UNBLOCKER_ENABLED: "1"
  LI_ORG_UNBLOCKER_INTERVAL_MS: "600000"
  LI_ORG_UNBLOCKER_MAX_IDLE_CYCLES: "0"
  LI_ORG_UNBLOCKER_STUCK_JOB_MINUTES: "20"
  LI_ORG_UNBLOCKER_LONG_RUN_JOB_MINUTES: "150"
  LI_ORG_UNBLOCKER_NAMESPACE: "li-swarm"
  NODE_ENV: "production"
