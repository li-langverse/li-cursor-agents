# Always-on World Studio GUI demo-recorder goal-directed agent (engine node, prebuilt image + PVC workspace).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-world-studio-gui-demo-recorder
  namespace: li-swarm
  labels:
    app: li-world-studio-gui-demo-recorder
    app.kubernetes.io/name: li-world-studio-gui-demo-recorder
    app.kubernetes.io/component: goal-directed-agent
    app.kubernetes.io/part-of: li-langverse
    li-langverse.io/sprint: world-studio-gui-demo-recorder
    li-langverse.io/role: world-studio-builder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li-world-studio-gui-demo-recorder
  template:
    metadata:
      labels:
        app: li-world-studio-gui-demo-recorder
        app.kubernetes.io/name: li-world-studio-gui-demo-recorder
        app.kubernetes.io/component: goal-directed-agent
        app.kubernetes.io/part-of: li-langverse
        li-langverse.io/sprint: world-studio-gui-demo-recorder
        li-langverse.io/role: world-studio-builder
      annotations:
        prometheus.io/scrape: "false"
        li-langverse.io/curator: julianmkleber.com
    spec:
      serviceAccountName: li-goal-worker
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      initContainers:
        - name: git-sync
          image: alpine/git:latest
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
                  optional: true
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GITLAB_TOKEN
                  optional: true
            - name: ORG
              value: "li-langverse"
            - name: STUDIO_REPO
              value: "http://10.43.79.43/li-langverse/studio.git"
            - name: LIC_REPO
              value: "http://10.43.79.43/li-langverse/lic.git"
          command:
            - sh
            - -lc
            - |
              set -eu
              auth_url() {
                tok="${GITLAB_TOKEN:-$GH_TOKEN}"
                prefix="oauth2"
                if [ -z "${GITLAB_TOKEN:-}" ]; then prefix="x-access-token"; fi
                echo "$1" | sed "s#http://#http://${prefix}:${tok}@#"
              }
              migrate_origin() {
                dir="$1" repo="$2"
                [ -d "$dir/.git" ] || return 0
                url="$(git -C "$dir" remote get-url origin 2>/dev/null || true)"
                case "$url" in
                  *github.com*|*gitlab.lilangverse.xyz*|*10.43.79.43*)
                    git -C "$dir" remote set-url origin "$(auth_url "http://10.43.79.43/li-langverse/${repo}.git")" ;;
                esac
              }
              mkdir -p /workspace
              if [ ! -d /workspace/studio/.git ]; then
                git clone --depth 1 "$(auth_url "$STUDIO_REPO")" /workspace/studio
              else
                migrate_origin /workspace/studio studio
                git -C /workspace/studio fetch origin --prune
              fi
              if [ ! -d /workspace/lic/.git ]; then
                git clone --depth 1 "$(auth_url "$LIC_REPO")" /workspace/lic
              else
                migrate_origin /workspace/lic lic
                git -C /workspace/lic fetch origin --prune
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: world-studio-gui-demo-recorder
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: li-world-studio-gui-demo-recorder
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
                  optional: true
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GITLAB_TOKEN
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
            - name: CURSOR_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_SDK_KEY
                  optional: true
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "8"
              memory: "12Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: config-bundle
              mountPath: /config
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li-world-studio-gui-demo-recorder-workspace
        - name: config-bundle
          configMap:
            name: li-world-studio-gui-demo-recorder-bundle
            defaultMode: 0755

