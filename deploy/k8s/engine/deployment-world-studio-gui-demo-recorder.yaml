# Goal-directed agent: native Studio GUI demo recorder (MCP control + MP4).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-world-studio-gui-demo-recorder
  namespace: li-swarm
  labels:
    app: li-world-studio-gui-demo-recorder
    li-langverse.io/sprint: world-studio-gui-demo-recorder
    li-langverse.io/role: world-studio-builder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li-world-studio-gui-demo-recorder
  template:
    metadata:
      labels:
        app: li-world-studio-gui-demo-recorder
        li-langverse.io/sprint: world-studio-gui-demo-recorder
    spec:
      serviceAccountName: li-goal-worker
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      initContainers:
        - name: git-sync
          image: alpine/git:latest
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: STUDIO_REPO
              value: "https://github.com/li-langverse/studio.git"
            - name: LIC_REPO
              value: "https://github.com/li-langverse/lic.git"
          command:
            - sh
            - -lc
            - |
              set -eu
              auth_url() { echo "$1" | sed "s#https://#https://x-access-token:${GH_TOKEN}@#"; }
              mkdir -p /workspace
              [ -d /workspace/studio/.git ] || git clone --depth 1 "$(auth_url "$STUDIO_REPO")" /workspace/studio
              [ -d /workspace/lic/.git ] || git clone --depth 1 "$(auth_url "$LIC_REPO")" /workspace/lic
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: world-studio-gui-demo-recorder
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: li-world-studio-gui-demo-recorder
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "8"
              memory: "12Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: config-bundle
              mountPath: /config
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li-world-studio-gui-demo-recorder-workspace
        - name: config-bundle
          configMap:
            name: li-world-studio-gui-demo-recorder-bundle
            defaultMode: 0755
