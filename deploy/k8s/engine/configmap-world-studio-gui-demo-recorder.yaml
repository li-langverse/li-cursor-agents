apiVersion: v1
kind: ConfigMap
metadata:
  name: li-world-studio-gui-demo-recorder
  namespace: li-swarm
  labels:
    app: li-world-studio-gui-demo-recorder
    app.kubernetes.io/name: li-world-studio-gui-demo-recorder
    app.kubernetes.io/component: goal-directed-agent
data:
  LI_GIT_HOST: "gitlab.lilangverse.xyz"
  LI_GIT_GROUP: "li-langverse"
  LI_WORLD_STUDIO_GUI_DEMO_RECORDER_ALWAYS_ON: "1"
  LI_WORLD_STUDIO_GUI_DEMO_RECORDER_LOOP_SLEEP_SEC: "60"

  LI_WORLD_STUDIO_GUI_DEMO_RECORDER_GOAL_FILE: "data/goal-directed-sprints/world-studio-gui-demo-recorder.md"
  LI_WORLD_STUDIO_GUI_DEMO_RECORDER_WORKFLOW_REPO: "studio"
  LI_WORLD_STUDIO_GUI_DEMO_RECORDER_AGENT: "world_studio_builder"

  LI_WORLD_STUDIO_GUI_DEMO_RECORDER_STUDIO_BRANCH: "cursor/world-studio-gui-demo-recorder"
  LI_WORLD_STUDIO_GUI_DEMO_RECORDER_LIC_BRANCH: "main"

  LI_WORLD_STUDIO_GUI_DEMO_RECORDER_STUDIO_ROOT: "/workspace/studio"
  LI_WORLD_STUDIO_GUI_DEMO_RECORDER_LIC_ROOT: "/workspace/lic"
  LI_CURSOR_AGENTS_ROOT: "/app"

  LI_GOAL_LOOP_GATE_ONLY: "1"
  LI_GOAL_GATE_PREFER_CWD: "0"
  LI_GOAL_SYNC_CWD_AFTER_RUN: "1"
  LI_GOAL_SELF_UNBLOCK: "1"
  LI_REPO_WORKFLOW_TRACK_REMOTE: "1"
  LI_GOAL_STUCK_THRESHOLD: "5"
  LI_GOAL_SCALE_DOWN_ON_COMPLETE: "1"
  LI_GOAL_DEPLOYMENT_NAME: "li-world-studio-gui-demo-recorder"
  LI_GOAL_NAMESPACE: "li-swarm"

  LI_SKIP_IMPLEMENTER_PREFLIGHT_GATE: "1"
  LI_SDK_TERMINAL_STREAM: "1"

  NODE_ENV: "production"
