apiVersion: v1
kind: ConfigMap
metadata:
  name: li-li-parallel-entrypoint
  namespace: li-swarm
  labels:
    app: li-li-parallel
    li-langverse.io/sprint: li-parallel-native-hpc
data:
  entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    if [[ -f /git-auth/k8s-git-auth.sh ]]; then
      # shellcheck source=/dev/null
      source /git-auth/k8s-git-auth.sh
    elif [[ -f /config/k8s-git-auth.sh ]]; then
      # shellcheck source=/dev/null
      source /config/k8s-git-auth.sh
    else
      # shellcheck source=/dev/null
      source /app/deploy/k8s-git-auth.sh
    fi
    li_git_primary_setup || exit 1
    ORG="${LI_GIT_GROUP:-li-langverse}"
    REPO_LIC="${LI_PROOF_EXPLORER_LIC_REPO:-lic}"
    PREFERRED_BRANCH="${LI_PROOF_EXPLORER_BRANCH:-cursor/li-parallel-native-hpc}"
    FALLBACK_RAW="${LI_PROOF_EXPLORER_BRANCH_FALLBACKS:-cursor/li-parallel-native-hpc,main}"
    LIC_ROOT="${LI_PROOF_EXPLORER_LIC_ROOT:-/workspace/lic}"
    AGENTS_ROOT="${LI_CURSOR_AGENTS_ROOT:-/app}"
    GOAL_REL="${LI_PROOF_EXPLORER_GOAL_FILE:-data/goal-directed-sprints/li-parallel-native-hpc.md}"
    echo "li-parallel-entrypoint: branch=${PREFERRED_BRANCH} goal=${GOAL_REL}"
    git config --global user.email "${LI_GIT_USER_EMAIL:-goal-worker@li-langverse.dev}"
    git config --global user.name "${LI_GIT_USER_NAME:-li-goal-worker}"

    branch_candidates() {
      local seen="" b
      for b in "$PREFERRED_BRANCH" ${FALLBACK_RAW//,/ }; do
        b="${b// /}"
        [[ -z "$b" ]] && continue
        [[ " $seen " == *" $b "* ]] && continue
        seen="$seen $b"
        echo "$b"
      done
    }

    sync_lic_repo() {
      mkdir -p "$(dirname "$LIC_ROOT")"
      if [[ ! -d "$LIC_ROOT/.git" ]]; then
        echo "li-parallel-entrypoint: cloning ${ORG}/${REPO_LIC}"
        li_git_clone_repo "$REPO_LIC" "$LIC_ROOT" "$PREFERRED_BRANCH"
      else
        li_git_ensure_remotes "$LIC_ROOT" "$REPO_LIC"
      fi
      git -C "$LIC_ROOT" fetch origin --prune
      local branch goal_ok=0
      for branch in $(branch_candidates); do
        if ! git -C "$LIC_ROOT" show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
          continue
        fi
        git -C "$LIC_ROOT" checkout -f -B "$branch" "origin/${branch}"
        git -C "$LIC_ROOT" reset --hard "origin/${branch}"
        if [[ -f "${LIC_ROOT}/${GOAL_REL}" ]]; then
          goal_ok=1
          export LI_PROOF_EXPLORER_BRANCH="$branch"
          export LI_REPO_WORKFLOW_BRANCH="$branch"
          echo "li-parallel-entrypoint: lic on branch=${branch} $(git -C "$LIC_ROOT" log -1 --oneline)"
          break
        fi
        echo "li-parallel-entrypoint: branch ${branch} missing goal ${GOAL_REL}, trying next"
      done
      [[ "$goal_ok" == "1" ]] || {
        echo "li-parallel-entrypoint: no branch contains goal ${GOAL_REL}" >&2
        exit 1
      }
    }

    ensure_lic_built() {
      # shellcheck source=lib/lic-bin-select.sh
      source "${LIC_ROOT}/scripts/lib/lic-bin-select.sh"
      if lic_rel="$(li_pick_lic_bin "$LIC_ROOT" 2>/dev/null)"; then
        case "$lic_rel" in
          ./*) export LIC="${LIC_ROOT}/${lic_rel#./}" ;;
          *) export LIC="$lic_rel" ;;
        esac
        echo "li-parallel-entrypoint: lic present at ${LIC}"
        return 0
      fi
      echo "li-parallel-entrypoint: building lic (LLVM 22 in-container)"
      if (cd "$LIC_ROOT" && bash scripts/build.sh); then
        if lic_rel="$(li_pick_lic_bin "$LIC_ROOT")"; then
          case "$lic_rel" in
            ./*) export LIC="${LIC_ROOT}/${lic_rel#./}" ;;
            *) export LIC="$lic_rel" ;;
          esac
          echo "li-parallel-entrypoint: lic build OK ${LIC}"
          return 0
        fi
      fi
      echo "li-parallel-entrypoint: WARN lic build failed; agent loop may retry" >&2
      return 0
    }

    sync_lic_repo
    ensure_lic_built
    export LI_PROOF_EXPLORER_LIC_ROOT="$LIC_ROOT" LI_CURSOR_AGENTS_ROOT="$AGENTS_ROOT" LIC_ROOT="$LIC_ROOT" LIC="${LIC:-}"
    export LI_PROOF_EXPLORER_GOAL_FILE="$GOAL_REL"
    exec node "${AGENTS_ROOT}/dist/cli/proof-explorer-worker.js" start
