# Goal-directed agent: li-research warm index ingest (li-langverse — li-agents-secrets).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: li-research-ingest-workspace
  namespace: li-swarm
  labels:
    app: li-research-ingest
    li-langverse.io/sprint: li-research-ingest
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: li-research-ingest
  namespace: li-swarm
  labels:
    app: li-research-ingest
    app.kubernetes.io/name: li-research-ingest
    app.kubernetes.io/component: goal-directed-agent
    app.kubernetes.io/part-of: li-langverse
    li-langverse.io/sprint: li-research-ingest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li-research-ingest
  template:
    metadata:
      labels:
        app: li-research-ingest
        app.kubernetes.io/name: li-research-ingest
        app.kubernetes.io/component: goal-directed-agent
        li-langverse.io/sprint: li-research-ingest
    spec:
      serviceAccountName: li-goal-worker
      nodeSelector:
        kubernetes.io/hostname: engine
      imagePullSecrets:
        - name: ghcr-li-langverse
      containers:
        - name: agent
          image: ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: li-research-ingest
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: GH_TOKEN
            - name: WARM_INDEX_PATH
              value: "/warm-index"
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_API_KEY
                  optional: true
            - name: CURSOR_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: li-agents-secrets
                  key: CURSOR_SDK_KEY
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: warm-index
              mountPath: /warm-index
            - name: config-bundle
              mountPath: /config
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li-research-ingest-workspace
        - name: warm-index
          hostPath:
            path: /srv/homelab/intenso-research/li-research/warm-index
            type: Directory
        - name: config-bundle
          configMap:
            name: li-research-ingest-bundle
            defaultMode: 0755
