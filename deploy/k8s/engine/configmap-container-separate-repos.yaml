apiVersion: v1
kind: ConfigMap
metadata:
  name: li-container-separate-repos
  namespace: li-swarm
  labels:
    app: li-container-separate-repos
    app.kubernetes.io/name: li-container-separate-repos
    app.kubernetes.io/component: goal-directed-agent
    li-langverse.io/sprint: container-separate-repos
data:
  LI_PROOF_EXPLORER_ALWAYS_ON: "1"
  LI_PROOF_EXPLORER_EXIT_ON_COMPLETE: "1"
  LI_PROOF_EXPLORER_PHASE_HANDOFF: "0"
  LI_PROOF_EXPLORER_GOAL_FILE: "data/goal-directed-sprints/container-separate-repos.md"
