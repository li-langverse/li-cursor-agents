apiVersion: v1
kind: ConfigMap
metadata:
  name: li-ph-ml-wave13-entrypoint
  namespace: li-swarm
  labels:
    app: li-ph-ml-wave13
    li-langverse.io/sprint: ph-ml-li-array
data:
  entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    # shellcheck source=/dev/null
    source /app/deploy/k8s-git-auth.sh
    li_git_primary_setup || exit 1
    ORG="${LI_GIT_GROUP:-li-langverse}"
    REPO_LIC="${LI_PROOF_EXPLORER_LIC_REPO:-lic}"
    REPO_BENCHMARKS="${LI_BENCHMARKS_REPO:-benchmarks}"
    PREFERRED_BRANCH="${LI_PROOF_EXPLORER_BRANCH:-main}"
    FALLBACK_RAW="${LI_PROOF_EXPLORER_BRANCH_FALLBACKS:-main,cursor/ph-ml-li-array-competitive,cursor/ph-ml-program-complete}"
    BENCHMARKS_BRANCH="${LI_BENCHMARKS_BRANCH:-main}"
    LIC_ROOT="${LI_PROOF_EXPLORER_LIC_ROOT:-/workspace/lic}"
    BENCHMARKS_ROOT="${BENCHMARKS_ROOT:-/workspace/benchmarks}"
    AGENTS_ROOT="${LI_CURSOR_AGENTS_ROOT:-/app}"
    GOAL_REL="${LI_PROOF_EXPLORER_GOAL_FILE:-data/goal-directed-sprints/ph-ml-li-array-competitive.md}"
    echo "ph-ml-wave13-entrypoint: preferred_branch=${PREFERRED_BRANCH} goal=${GOAL_REL}"
    ensure_openblas() {
      if find /usr -name 'libopenblas.so*' 2>/dev/null | grep -q .; then
        echo "ph-ml-wave13-entrypoint: OpenBLAS present"
        return 0
      fi
      echo "ph-ml-wave13-entrypoint: installing OpenBLAS (libopenblas0)"
      apt-get update
      apt-get install -y --no-install-recommends libopenblas0
      rm -rf /var/lib/apt/lists/*
      find /usr -name 'libopenblas.so*' 2>/dev/null | head -3 || true
    }
    ensure_openblas
    git config --global user.email "${LI_GIT_USER_EMAIL:-goal-worker@li-langverse.dev}"
    git config --global user.name "${LI_GIT_USER_NAME:-li-goal-worker}"

    branch_candidates() {
      local seen="" b
      for b in "$PREFERRED_BRANCH" ${FALLBACK_RAW//,/ }; do
        b="${b// /}"
        [[ -z "$b" ]] && continue
        [[ " $seen " == *" $b "* ]] && continue
        seen="$seen $b"
        echo "$b"
      done
    }

    sync_lic_repo() {
      mkdir -p "$(dirname "$LIC_ROOT")"
      if [[ ! -d "$LIC_ROOT/.git" ]]; then
        echo "ph-ml-wave13-entrypoint: cloning ${ORG}/${REPO_LIC}"
        li_git_clone_repo "$REPO_LIC" "$LIC_ROOT" "$PREFERRED_BRANCH"
      fi
      git -C "$LIC_ROOT" fetch origin --prune
      local branch goal_ok=0
      for branch in $(branch_candidates); do
        if ! git -C "$LIC_ROOT" show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
          continue
        fi
        git -C "$LIC_ROOT" checkout -f -B "$branch" "origin/${branch}"
        git -C "$LIC_ROOT" reset --hard "origin/${branch}"
        if [[ -f "${LIC_ROOT}/${GOAL_REL}" ]]; then
          goal_ok=1
          export LI_PROOF_EXPLORER_BRANCH="$branch"
          export LI_REPO_WORKFLOW_BRANCH="$branch"
          echo "ph-ml-wave13-entrypoint: lic on branch=${branch} $(git -C "$LIC_ROOT" log -1 --oneline)"
          break
        fi
        echo "ph-ml-wave13-entrypoint: branch ${branch} missing goal ${GOAL_REL}, trying next"
      done
      [[ "$goal_ok" == "1" ]] || {
        echo "ph-ml-wave13-entrypoint: no branch contains goal ${GOAL_REL}" >&2
        exit 1
      }
    }

    sync_benchmarks_repo() {
      if [[ ! -d "$BENCHMARKS_ROOT/.git" ]]; then
        echo "ph-ml-wave13-entrypoint: cloning ${ORG}/${REPO_BENCHMARKS}"
        li_git_clone_repo "$REPO_BENCHMARKS" "$BENCHMARKS_ROOT" "$BENCHMARKS_BRANCH"
        return 0
      fi
      echo "ph-ml-wave13-entrypoint: updating benchmarks clone"
      git -C "$BENCHMARKS_ROOT" fetch origin --prune
      if git -C "$BENCHMARKS_ROOT" show-ref --verify --quiet "refs/remotes/origin/${BENCHMARKS_BRANCH}"; then
        git -C "$BENCHMARKS_ROOT" checkout -f -B "$BENCHMARKS_BRANCH" "origin/${BENCHMARKS_BRANCH}"
        git -C "$BENCHMARKS_ROOT" reset --hard "origin/${BENCHMARKS_BRANCH}"
      elif git -C "$BENCHMARKS_ROOT" show-ref --verify --quiet "refs/heads/${BENCHMARKS_BRANCH}"; then
        git -C "$BENCHMARKS_ROOT" checkout -f "$BENCHMARKS_BRANCH"
        git -C "$BENCHMARKS_ROOT" fetch origin "$BENCHMARKS_BRANCH" 2>/dev/null || true
        git -C "$BENCHMARKS_ROOT" reset --hard "origin/${BENCHMARKS_BRANCH}" 2>/dev/null || true
      else
        git -C "$BENCHMARKS_ROOT" checkout -f -B "$BENCHMARKS_BRANCH"
      fi
    }

    lic_stale_for_inference_sse() {
      local lic_bin="$1"
      [[ -x "$lic_bin" ]] || return 0
      local marker="${LIC_ROOT}/runtime/li_rt_inference_sse.c"
      [[ -f "$marker" ]] || return 1
      local src
      for src in \
        "${LIC_ROOT}/compiler/codegen/compile.cpp" \
        "${LIC_ROOT}/compiler/mir/mir_runtime_link.cpp" \
        "$marker"; do
        if [[ -f "$src" ]] && [[ "$src" -nt "$lic_bin" ]]; then
          return 0
        fi
      done
      return 1
    }

    ensure_lic_built() {
      # shellcheck source=lib/lic-bin-select.sh
      source "${LIC_ROOT}/scripts/lib/lic-bin-select.sh"
      local lic_bin=""
      if lic_rel="$(li_pick_lic_bin "$LIC_ROOT" 2>/dev/null)"; then
        case "$lic_rel" in
          ./*) lic_bin="${LIC_ROOT}/${lic_rel#./}" ;;
          *) lic_bin="$lic_rel" ;;
        esac
        export LIC="$lic_bin"
      fi
      if [[ -n "$lic_bin" ]] && [[ -x "$lic_bin" ]] && ! lic_stale_for_inference_sse "$lic_bin"; then
        echo "ph-ml-wave13-entrypoint: lic compiler present at ${LIC}"
        return 0
      fi
      if [[ -n "$lic_bin" ]]; then
        echo "ph-ml-wave13-entrypoint: stale lic (stage8 inference SSE link); rebuilding"
      else
        echo "ph-ml-wave13-entrypoint: building lic (LLVM 22 in-container)"
      fi
      if (cd "$LIC_ROOT" && bash scripts/build.sh); then
        if lic_rel="$(li_pick_lic_bin "$LIC_ROOT")"; then
          case "$lic_rel" in
            ./*) export LIC="${LIC_ROOT}/${lic_rel#./}" ;;
            *) export LIC="$lic_rel" ;;
          esac
          echo "ph-ml-wave13-entrypoint: lic build OK ${LIC}"
          return 0
        fi
      fi
      echo "ph-ml-wave13-entrypoint: WARN lic build failed; agent loop may retry" >&2
      return 0
    }

    ensure_inference_native_backend() {
      local script="${LIC_ROOT}/scripts/build-inference-native-backend.sh"
      [[ -f "$script" ]] || return 0
      echo "ph-ml-wave13-entrypoint: building inference-native-backend (stage8 SSE upstream)"
      if (cd "$LIC_ROOT" && bash scripts/build-inference-native-backend.sh); then
        echo "ph-ml-wave13-entrypoint: inference-native-backend OK"
        return 0
      fi
      echo "ph-ml-wave13-entrypoint: WARN inference-native-backend build failed" >&2
      return 0
    }

    ensure_ph_ml_python_deps() {
      if python3 -c "import numpy, torch, jax" 2>/dev/null; then
        echo "ph-ml-wave13-entrypoint: ph-ml python deps present"
        return 0
      fi
      echo "ph-ml-wave13-entrypoint: installing ph-ml python deps (numpy/torch/jax; tensorflow optional)"
      python3 -m pip install --user --break-system-packages         "numpy==2.2.6" "torch==2.6.0" "jax==0.5.3" "jaxlib==0.5.3"         >/tmp/ph-ml-pip-core.log 2>&1 || {
        echo "ph-ml-wave13-entrypoint: WARN core pip install failed; see /tmp/ph-ml-pip-core.log" >&2
        tail -15 /tmp/ph-ml-pip-core.log >&2 || true
      }
      python3 -m pip install --user --break-system-packages         -r "${LIC_ROOT}/scripts/requirements-ph-ml-wave12-rl.txt"         >/tmp/ph-ml-pip-rl.log 2>&1 || {
        echo "ph-ml-wave13-entrypoint: WARN rl pip install failed; see /tmp/ph-ml-pip-rl.log" >&2
      }
      python3 -m pip install --user --break-system-packages "tensorflow==2.18.1"         >/tmp/ph-ml-pip-tf.log 2>&1 || echo "ph-ml-wave13-entrypoint: tensorflow optional (skipped or failed)"
      if python3 -c "import numpy" 2>/dev/null; then
        echo "ph-ml-wave13-entrypoint: ph-ml python deps ready (numpy+)"
      else
        echo "ph-ml-wave13-entrypoint: WARN numpy still missing after pip" >&2
      fi
    }

    sync_lic_repo
    sync_benchmarks_repo
    ensure_ph_ml_python_deps
    test -f "${BENCHMARKS_ROOT}/harness/bench.py" || {
      echo "ph-ml-wave13-entrypoint: missing benchmarks harness at ${BENCHMARKS_ROOT}/harness/bench.py" >&2
      exit 1
    }
    ensure_lic_built
    ensure_inference_native_backend
    export LI_PROOF_EXPLORER_LIC_ROOT="$LIC_ROOT" LI_CURSOR_AGENTS_ROOT="$AGENTS_ROOT" LIC_ROOT="$LIC_ROOT" BENCHMARKS_ROOT="$BENCHMARKS_ROOT"
    export LI_PROOF_EXPLORER_GOAL_FILE="$GOAL_REL"
    exec node "${AGENTS_ROOT}/dist/cli/proof-explorer-worker.js" start
