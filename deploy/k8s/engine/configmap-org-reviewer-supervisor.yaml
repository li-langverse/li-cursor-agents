apiVersion: v1
kind: ConfigMap
metadata:
  name: li-org-reviewer-supervisor
  namespace: li-swarm
data:
  LI_VCS_PROVIDER: "gitlab"
  LI_GITLAB_HOST: "gitlab.lilangverse.xyz"
  LI_GITLAB_GROUP: "li-langverse"
  LI_ORG_REVIEWER_SUPERVISOR_ENABLED: "1"
  LI_ORG_REVIEWER_SUPERVISOR_INTERVAL_MS: "900000"
  LI_ORG_REVIEWER_QUEUE_REFRESH_ENABLED: "0"
  LI_ORG_PR_QUEUE_MAX_AGE_MS: "1800000"
  LI_ORG_REVIEWER_SUPERVISOR_MAX_IDLE_CYCLES: "0"
  LI_ORG_REVIEWER_SUPERVISOR_MAX_WORKERS: "3"
  LI_SDK_MAX_CONCURRENT: "1"
  LI_ORG_PR_SUPERVISOR_NAMESPACE: "li-swarm"
  LI_ORG_REVIEWER_SUPERVISOR_IMAGE: "ghcr.io/li-langverse/li-cursor-agents:latest"
  LI_CONTROL_PLANE_STORE: "disk"
  NODE_ENV: "production"
