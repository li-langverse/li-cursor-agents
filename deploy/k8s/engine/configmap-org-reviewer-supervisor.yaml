apiVersion: v1
kind: ConfigMap
metadata:
  name: li-org-reviewer-supervisor
  namespace: li-swarm
data:
  LI_ORG_REVIEWER_SUPERVISOR_ENABLED: "1"
  LI_ORG_REVIEWER_SUPERVISOR_INTERVAL_MS: "120000"
  LI_ORG_REVIEWER_SUPERVISOR_MAX_IDLE_CYCLES: "3"
  LI_ORG_REVIEWER_SUPERVISOR_MAX_WORKERS: "3"
  LI_ORG_PR_SUPERVISOR_NAMESPACE: "li-swarm"
  LI_ORG_REVIEWER_SUPERVISOR_IMAGE: "ghcr.io/li-langverse/li-cursor-agents:latest"
  LI_CONTROL_PLANE_STORE: "supabase"
  NODE_ENV: "production"
