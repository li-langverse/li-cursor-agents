# RBAC for org PR implementer supervisor + reviewer supervisor (Jobs + wake scale Deployments).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: li-org-pr-supervisor
  namespace: li-swarm
  labels:
    app: li-org-pr-supervisor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: li-org-pr-implementer
  namespace: li-swarm
  labels:
    app: li-org-pr-implementer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: li-org-reviewer-supervisor
  namespace: li-swarm
  labels:
    app: li-org-reviewer-supervisor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: li-org-pr-reviewer
  namespace: li-swarm
  labels:
    app: li-org-pr-reviewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: li-org-pr-supervisor
  namespace: li-swarm
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: li-org-pr-supervisor
  namespace: li-swarm
subjects:
  - kind: ServiceAccount
    name: li-org-pr-supervisor
    namespace: li-swarm
  - kind: ServiceAccount
    name: li-org-reviewer-supervisor
    namespace: li-swarm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: li-org-pr-supervisor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: li-org-pr-implementer
  namespace: li-swarm
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: li-org-pr-implementer
  namespace: li-swarm
subjects:
  - kind: ServiceAccount
    name: li-org-pr-implementer
    namespace: li-swarm
  - kind: ServiceAccount
    name: li-org-pr-reviewer
    namespace: li-swarm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: li-org-pr-implementer
