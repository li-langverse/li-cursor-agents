apiVersion: v1
kind: ConfigMap
metadata:
  name: li-org-implement-goals-supervisor
  namespace: li-swarm
data:
  LI_VCS_PROVIDER: "gitlab"
  LI_GITLAB_HOST: "gitlab.lilangverse.xyz"
  LI_GITLAB_GROUP: "li-langverse"
  LI_ORG_IMPLEMENT_SUPERVISOR_ENABLED: "1"
  LI_ORG_IMPLEMENT_SUPERVISOR_INTERVAL_MS: "300000"
  LI_ORG_IMPLEMENT_SUPERVISOR_MAX_IDLE_CYCLES: "0"
  LI_ORG_IMPLEMENT_SUPERVISOR_MAX_WORKERS: "2"
  LI_ORG_IMPLEMENT_SUPERVISOR_NAMESPACE: "li-swarm"
  LI_ORG_IMPLEMENT_SUPERVISOR_IMAGE: "ghcr.io/li-langverse/li-cursor-agents:latest"
  LI_IMPLEMENT_LANE_ENABLED: "1"
  LI_CONTROL_PLANE_STORE: "disk"
  LIC_ROOT: "/workspace/lic"
  BENCHMARKS_ROOT: "/workspace/benchmarks"
  LI_ORG_SYNC_LIC: "1"
  LI_ORG_SYNC_BENCHMARKS: "1"
  NODE_ENV: "production"
