apiVersion: v1
kind: ConfigMap
metadata:
  name: li-world-studio-typography-fx-animation
  namespace: li-swarm
  labels:
    app: li-world-studio-typography-fx-animation
    app.kubernetes.io/name: li-world-studio-typography-fx-animation
    app.kubernetes.io/component: goal-directed-agent
data:
  LI_WORLD_STUDIO_TYPOGRAPHY_FX_ANIMATION_ALWAYS_ON: "1"
  LI_WORLD_STUDIO_TYPOGRAPHY_FX_ANIMATION_LOOP_SLEEP_SEC: "60"

  LI_WORLD_STUDIO_TYPOGRAPHY_FX_ANIMATION_GOAL_FILE: "data/goal-directed-sprints/world-studio-typography-fx-animation.md"
  LI_WORLD_STUDIO_TYPOGRAPHY_FX_ANIMATION_WORKFLOW_REPO: "studio"
  LI_WORLD_STUDIO_TYPOGRAPHY_FX_ANIMATION_AGENT: "world_studio_builder"

  LI_WORLD_STUDIO_TYPOGRAPHY_FX_ANIMATION_STUDIO_BRANCH: "cursor/world-studio-typography-fx-animation"
  LI_WORLD_STUDIO_TYPOGRAPHY_FX_ANIMATION_LIC_BRANCH: "cursor/world-studio-typography-fx-animation"

  LI_WORLD_STUDIO_TYPOGRAPHY_FX_ANIMATION_STUDIO_ROOT: "/workspace/studio"
  LI_WORLD_STUDIO_TYPOGRAPHY_FX_ANIMATION_LIC_ROOT: "/workspace/lic"
  LI_CURSOR_AGENTS_ROOT: "/app"

  LI_GOAL_LOOP_GATE_ONLY: "1"
  LI_GOAL_GATE_PREFER_CWD: "0"
  LI_GOAL_SYNC_CWD_AFTER_RUN: "1"
  LI_GOAL_SELF_UNBLOCK: "1"
  LI_REPO_WORKFLOW_TRACK_REMOTE: "1"
  LI_GOAL_STUCK_THRESHOLD: "5"
  LI_GOAL_SCALE_DOWN_ON_COMPLETE: "1"
  LI_GOAL_DEPLOYMENT_NAME: "li-world-studio-typography-fx-animation"
  LI_GOAL_NAMESPACE: "li-swarm"

  LI_SKIP_IMPLEMENTER_PREFLIGHT_GATE: "1"
  LI_SDK_TERMINAL_STREAM: "1"

  NODE_ENV: "production"
