# Deterministic briefing refresh — no Cursor SDK / no LLM (Actions minutes budget).
# Local research/implement lanes consume data/latest/agent-briefing.json on next tick.
name: Swarm maintenance

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: swarm-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-scorecards:
    runs-on: ubuntu-24.04
    env:
      LI_CONTROL_PLANE_STORE: disk
      BENCHMARKS_ROOT: ${{ github.workspace }}/fixtures/e2e-benchmarks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Run fixture preflight + enrich scorecards
        run: |
          python3 fixtures/e2e-benchmarks/scripts/agent-briefing.py
          npm run agents:maintenance-lane -- --once

      - name: Upload briefing artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-briefing-${{ github.run_id }}
          path: |
            fixtures/e2e-benchmarks/data/latest/agent-briefing.json
            data/latest/agent-briefing.json
          if-no-files-found: warn
