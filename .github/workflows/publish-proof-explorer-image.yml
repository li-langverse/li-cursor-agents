name: Publish proof-explorer image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/Dockerfile.proof-explorer"
      - "deploy/lic-ci-base.env"
      - "deploy/proof-explorer-entrypoint.sh"
      - "src/proof-explorer/**"
      - "src/cli/proof-explorer-worker.ts"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.proof-explorer
          push: true
          build-args: |
            LI_CI_IMAGE=ghcr.io/li-langverse/lic-ci:debian12-llvm22
          tags: |
            ghcr.io/li-langverse/li-cursor-agents:proof-explorer
            ghcr.io/li-langverse/li-cursor-agents:proof-explorer-llvm22
            ghcr.io/li-langverse/li-cursor-agents:proof-explorer-${{ github.sha }}
