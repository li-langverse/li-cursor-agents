name: Publish org-issue worker image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: false
        default: main
        type: string
  push:
    branches: [main]
    paths:
      - "deploy/Dockerfile"
      - "deploy/lic-ci-base.env"
      - "src/cli/org-issue-worker.ts"
      - "src/**"
      - "apps/org-supervisor-dashboard/**"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            LI_CI_IMAGE=ghcr.io/li-langverse/lic-ci:debian12-llvm22
          tags: |
            ghcr.io/li-langverse/li-cursor-agents:latest
            ghcr.io/li-langverse/li-cursor-agents:${{ github.sha }}
