name: Publish org-issue worker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/Dockerfile"
      - "src/cli/org-issue-worker.ts"
      - "src/**"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/li-langverse/li-cursor-agents:latest
            ghcr.io/li-langverse/li-cursor-agents:${{ github.sha }}