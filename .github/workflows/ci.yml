name: CI

# GHA minutes: prefer local CI — ../li-local-ci/bin/li-local-ci run li-cursor-agents
# Cloud CI: push main + workflow_dispatch only (no PR matrix — quota).
# PH-DB lidb e2e: .github/workflows/ph-db-lidb-engine.yml (dispatch only; LI_LIDB_REPO checkout).
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-mock-agents:
    runs-on: ubuntu-24.04
    env:
      CURSOR_MOCK: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Unit tests (mock backend)
        run: |
          export CURSOR_MOCK=1
          npm test

      # E2e (swarm handoff, SDK matrix, all-leaves) — local only: npm run test:e2e, test:full, ci:local
