name: CI

# GHA minutes: prefer local CI — ../li-local-ci/bin/li-local-ci run li-cursor-agents
# Cloud CI: manual dispatch only (or add pull_request back when quota allows).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test-mock-agents:
    runs-on: ubuntu-24.04
    env:
      CURSOR_MOCK: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Unit tests (mock backend)
        run: |
          export CURSOR_MOCK=1
          npm test

      # E2e (swarm handoff, SDK matrix, all-leaves) — local only: npm run test:e2e, test:full, ci:local
  lidb-engine-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lidb
          path: lidb
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build lidb_embed
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3
          cmake -S lidb -B lidb/build/smoke -DCMAKE_BUILD_TYPE=Release
          cmake --build lidb/build/smoke --target lidb_embed -j
      - name: Install and test
        env:
          LI_CONTROL_PLANE_STORE: lidb
          LI_E2E_LIDB: "1"
          LI_E2E_LIDB_ENGINE: "1"
          LI_LIDB_REPO: lidb
          LI_DATA_DIR: /tmp/li-cp-e2e
        run: |
          npm ci
          npm run build
          npm run test:e2e:lidb-engine

