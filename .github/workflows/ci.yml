name: CI

# GHA minutes: prefer local CI — ../li-local-ci/bin/li-local-ci run li-cursor-agents
# Cloud CI: manual dispatch only (or add pull_request back when quota allows).
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-mock-agents:
    runs-on: ubuntu-24.04
    env:
      CURSOR_MOCK: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Unit + E2E tests (mock backend)
        run: npm test

      - name: E2E swarm + heap + agent matrix
        run: npm run test:e2e

      - name: Verify run artifacts
        run: test -n "$(ls data/runs/*.md 2>/dev/null | head -1)"
